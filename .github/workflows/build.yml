name: Build VST3 & AU Plugin

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      - name: Package Artifacts & README
        shell: bash
        run: |
          mkdir -p release_package
          find build -maxdepth 5 -name "*.vst3" -exec cp -R {} release_package/ \;
          find build -maxdepth 5 -name "*.component" -exec cp -R {} release_package/ \;
          if [ -f README.md ]; then
            cp README.md release_package/
          elif [ -f readme.md ]; then
            cp readme.md release_package/
          fi

      - name: Upload Compiled Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DirtyMogger-${{ matrix.os }}
          path: release_package/
